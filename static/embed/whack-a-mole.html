<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whack-a-Mole</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: radial-gradient(circle at 50% 0%, #365314, #0f0b2e 75%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; user-select: none; touch-action: manipulation; }
  .hud { display: flex; gap: 22px; font-weight: 700; font-size: 16px; }
  .hud b { color: #fbbf24; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: min(2vh, 12px); width: min(62vh, 88vw, 380px); }
  .hole { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: radial-gradient(circle at 50% 60%, #1c1917 55%, #44403c 56%, #57534e 100%); overflow: hidden; cursor: pointer; }
  .mole { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: min(11vh, 62px); line-height: 1; transform: translateY(110%); transition: transform .12s ease-out; }
  .hole.up .mole { transform: translateY(8%); }
  .hole.hit .mole { transform: translateY(110%); }
  .pow { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(7vh, 30px); font-weight: 900; color: #fde047; opacity: 0; pointer-events: none; }
  .hole.hit .pow { animation: pow .4s; }
  @keyframes pow { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.6); } }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(15,11,46,.82); text-align: center; padding: 16px; }
  #overlay h1 { font-size: clamp(24px, 6vw, 38px); }
  #overlay p { color: #d9f99d; max-width: 320px; font-size: 14px; }
  #go { margin-top: 6px; border: 0; border-radius: 999px; padding: 12px 34px; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, #7c3aed, #ec4899); box-shadow: 0 10px 30px -10px rgba(236,72,153,.8); }
</style>
</head>
<body>
<div class="hud"><span>Score <b id="score">0</b></span><span>Time <b id="time">30</b></span><span>Best <b id="best">0</b></span></div>
<div id="grid"></div>
<div id="overlay"><h1 id="title">Whack-a-Mole 🔨</h1><p id="sub">Tap the moles as they pop up. You have 30 seconds!</p><button id="go" type="button">Start</button></div>
<script>
(() => {
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const DURATION = 30;
  const holes = [];
  let score = 0, time = DURATION, playing = false, best = 0, tickTimer = null, popTimer = null;
  const upTimers = new Map();

  try { best = +localStorage.getItem('playnest-mole-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  for (let i = 0; i < 9; i++) {
    const h = document.createElement('button');
    h.type = 'button'; h.className = 'hole';
    h.setAttribute('aria-label', 'Hole ' + (i + 1));
    h.innerHTML = '<span class="mole">🐹</span><span class="pow">POW!</span>';
    h.addEventListener('pointerdown', () => whack(i));
    grid.appendChild(h); holes.push(h);
  }

  function hide(i) {
    holes[i].classList.remove('up');
    clearTimeout(upTimers.get(i));
    upTimers.delete(i);
  }

  function whack(i) {
    if (!playing || !holes[i].classList.contains('up')) return;
    score++; scoreEl.textContent = score;
    holes[i].classList.add('hit');
    hide(i);
    setTimeout(() => holes[i].classList.remove('hit'), 420);
  }

  function popUp() {
    if (!playing) return;
    const free = holes.map((h, i) => h.classList.contains('up') ? -1 : i).filter(i => i >= 0);
    if (free.length) {
      const i = free[Math.floor(Math.random() * free.length)];
      holes[i].classList.add('up');
      const stay = Math.max(450, 1000 - (DURATION - time) * 18);
      upTimers.set(i, setTimeout(() => hide(i), stay));
    }
    const gap = Math.max(260, 750 - (DURATION - time) * 14);
    popTimer = setTimeout(popUp, gap + Math.random() * 200);
  }

  function start() {
    score = 0; time = DURATION; playing = true;
    scoreEl.textContent = 0; timeEl.textContent = DURATION;
    holes.forEach((h, i) => { h.classList.remove('hit'); hide(i); });
    overlay.style.display = 'none';
    tickTimer = setInterval(() => {
      time--; timeEl.textContent = Math.max(0, time);
      if (time <= 0) end();
    }, 1000);
    popUp();
  }

  function end() {
    playing = false;
    clearInterval(tickTimer); clearTimeout(popTimer);
    holes.forEach((h, i) => hide(i));
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('playnest-mole-best', String(best)); } catch (e) {} }
    document.getElementById('title').textContent = 'Time is up!';
    document.getElementById('sub').textContent = 'You whacked ' + score + ' moles. Best: ' + best + '.';
    document.getElementById('go').textContent = 'Play again';
    overlay.style.display = 'flex';
  }

  document.getElementById('go').addEventListener('click', start);
})();
</script>
</body>
</html>
