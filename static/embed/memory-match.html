<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Memory Match</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: radial-gradient(circle at 50% 0%, #2a1a6e, #0f0b2e 70%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; user-select: none; }
  .hud { display: flex; gap: 22px; font-weight: 600; font-size: 15px; align-items: center; }
  .hud b { color: #fbbf24; }
  .hud button { border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 700; color: #fff; background: #352b7a; cursor: pointer; }
  .hud button:hover { background: #4c3fa6; }
  #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: min(1.6vh, 8px); width: min(72vh, 90vw, 420px); aspect-ratio: 1; }
  .card { perspective: 600px; border: 0; background: none; padding: 0; cursor: pointer; }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .35s; }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .front { background: linear-gradient(135deg, #7c3aed, #ec4899); font-size: min(5vh, 26px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
  .back { transform: rotateY(180deg); background: #f5f3ff; font-size: min(8vh, 40px); }
  .card.matched .back { background: #bbf7d0; animation: pulse .5s; }
  @keyframes pulse { 50% { transform: rotateY(180deg) scale(1.12); } }
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(15,11,46,.85); text-align: center; padding: 16px; }
  #win h1 { font-size: clamp(24px, 6vw, 38px); }
  #win p { color: #c4b5fd; }
  #win button { margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 32px; font-size: 16px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, #7c3aed, #ec4899); }
</style>
</head>
<body>
<div class="hud"><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0s</b></span><button id="restart" type="button">Restart</button></div>
<div id="board"></div>
<div id="win"><h1>You did it! 🎉</h1><p id="winText"></p><button id="again" type="button">Play again</button></div>
<script>
(() => {
  const EMOJI = ['🍕', '🚀', '🐼', '🎸', '🍩', '🦊', '⚽', '🌈'];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const win = document.getElementById('win');
  const winText = document.getElementById('winText');
  let first = null, lock = false, moves = 0, matched = 0, seconds = 0, timer = null;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newGame() {
    clearInterval(timer);
    timer = null; first = null; lock = false; moves = 0; matched = 0; seconds = 0;
    movesEl.textContent = 0; timeEl.textContent = '0s';
    win.style.display = 'none';
    board.innerHTML = '';
    shuffle([...EMOJI, ...EMOJI]).forEach((emoji) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.setAttribute('aria-label', 'Hidden card');
      card.innerHTML = '<span class="inner"><span class="face front">❔</span><span class="face back">' + emoji + '</span></span>';
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (!timer) {
      timer = setInterval(() => { seconds++; timeEl.textContent = seconds + 's'; }, 1000);
    }
    card.classList.add('flipped');
    if (!first) { first = card; return; }
    moves++;
    movesEl.textContent = moves;
    if (first.dataset.emoji === card.dataset.emoji) {
      first.classList.add('matched'); card.classList.add('matched');
      first = null; matched++;
      if (matched === EMOJI.length) finish();
    } else {
      lock = true;
      const a = first; first = null;
      setTimeout(() => { a.classList.remove('flipped'); card.classList.remove('flipped'); lock = false; }, 750);
    }
  }

  function finish() {
    clearInterval(timer);
    winText.textContent = 'You found every pair in ' + moves + ' moves and ' + seconds + ' seconds.';
    setTimeout(() => { win.style.display = 'flex'; }, 500);
  }

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
