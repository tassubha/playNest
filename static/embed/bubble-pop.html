<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bubble Pop</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, #1e1b6e, #0f0b2e); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; font-weight: 700; font-size: 18px; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .hud b { color: #fbbf24; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(15,11,46,.78); text-align: center; padding: 16px; }
  #overlay h1 { font-size: clamp(24px, 6vw, 40px); }
  #overlay p { color: #c4b5fd; max-width: 320px; font-size: 14px; }
  button { margin-top: 6px; border: 0; border-radius: 999px; padding: 12px 34px; font-size: 17px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, #7c3aed, #ec4899); box-shadow: 0 10px 30px -10px rgba(236,72,153,.8); transition: transform .15s; }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>Score <b id="score">0</b></span><span>Time <b id="time">30</b></span></div>
<div id="overlay">
  <h1 id="title">Bubble Pop</h1>
  <p id="sub">Pop as many bubbles as you can in 30 seconds. Small bubbles score more!</p>
  <button id="go" type="button">Start</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const goBtn = document.getElementById('go');
  const DURATION = 30;
  let W = 0, H = 0, bubbles = [], bits = [], score = 0, time = DURATION, playing = false, last = 0, spawnT = 0, best = 0;

  try { best = +localStorage.getItem('playnest-bubble-best') || 0; } catch (e) {}

  function resize() {
    const r = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * r; cv.height = H * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function spawn() {
    const base = Math.min(W, H);
    const r = base * (0.05 + Math.random() * 0.06);
    bubbles.push({
      x: r + Math.random() * (W - r * 2), y: H + r, r,
      vy: base * (0.18 + Math.random() * 0.22) + (DURATION - time) * 3,
      hue: Math.floor(Math.random() * 360), wob: Math.random() * 6.28, born: performance.now()
    });
  }

  function burst(b) {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * (60 + Math.random() * 120), vy: Math.sin(a) * (60 + Math.random() * 120), life: 0.5, hue: b.hue });
    }
  }

  function pop(px, py) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      const dx = px - b.x, dy = py - b.y;
      if (dx * dx + dy * dy <= (b.r + 6) * (b.r + 6)) {
        const base = Math.min(W, H);
        score += b.r < base * 0.07 ? 3 : b.r < base * 0.09 ? 2 : 1;
        scoreEl.textContent = score;
        burst(b);
        bubbles.splice(i, 1);
        return;
      }
    }
  }

  cv.addEventListener('pointerdown', (e) => { if (playing) pop(e.clientX, e.clientY); });

  function start() {
    score = 0; time = DURATION; bubbles = []; bits = []; spawnT = 0;
    scoreEl.textContent = 0; timeEl.textContent = DURATION;
    overlay.style.display = 'none';
    playing = true;
  }

  function end() {
    playing = false;
    if (score > best) { best = score; try { localStorage.setItem('playnest-bubble-best', String(best)); } catch (e) {} }
    titleEl.textContent = 'Time is up!';
    subEl.textContent = 'You scored ' + score + '. Best: ' + best + '.';
    goBtn.textContent = 'Play again';
    overlay.style.display = 'flex';
  }

  goBtn.addEventListener('click', start);

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    if (playing) {
      time -= dt;
      timeEl.textContent = Math.max(0, Math.ceil(time));
      if (time <= 0) end();
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = 0.22 + Math.random() * 0.3; }
    }
    for (const b of bubbles) { b.y -= b.vy * dt; b.x += Math.sin(t / 500 + b.wob) * 0.4; }
    bubbles = bubbles.filter(b => b.y > -b.r * 2);
    for (const p of bits) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    bits = bits.filter(p => p.life > 0);

    ctx.clearRect(0, 0, W, H);
    for (const b of bubbles) {
      const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
      g.addColorStop(0, 'hsla(' + b.hue + ',90%,85%,.95)');
      g.addColorStop(1, 'hsla(' + b.hue + ',85%,55%,.55)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
    }
    for (const p of bits) {
      ctx.fillStyle = 'hsla(' + p.hue + ',90%,70%,' + Math.max(0, p.life * 2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
