<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Rush</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a1a6e, #0f0b2e 70%);
    color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; overflow: hidden; user-select: none; touch-action: none;
  }
  .hud { display: flex; gap: 22px; font-weight: 600; font-size: 15px; }
  .hud b { color: #fbbf24; }
  canvas {
    width: min(74vh, 92vw, 440px); aspect-ratio: 1; border-radius: 16px;
    box-shadow: 0 0 0 3px #352b7a, 0 20px 60px -15px rgba(236,72,153,.5);
    background: #120d3a;
  }
  #msg { font-size: 14px; color: #c4b5fd; min-height: 20px; text-align: center; padding: 0 8px; }
</style>
</head>
<body>
<div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="c" width="400" height="400" tabindex="0"></canvas>
<div id="msg">Press an arrow key or swipe to start</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msg = document.getElementById('msg');
  const N = 20, S = cv.width / N;
  let snake, dir, nextDir, food, score, best = 0, running = false, over = false, timer = null;

  try { best = +localStorage.getItem('playnest-snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function reset() {
    clearTimeout(timer);
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    running = false;
    over = false;
    scoreEl.textContent = 0;
    placeFood();
    draw();
    msg.textContent = 'Press an arrow key or swipe to start';
  }

  function schedule() {
    const delay = Math.max(70, 130 - score * 3);
    timer = setTimeout(tick, delay);
  }

  function start() {
    running = true;
    msg.textContent = 'Eat the apples. Avoid walls and your tail!';
    schedule();
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    schedule();
  }

  function gameOver() {
    running = false;
    over = true;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('playnest-snake-best', String(best)); } catch (e) {}
    }
    draw();
    msg.textContent = 'Game over! Press any arrow key or swipe to play again.';
  }

  function steer(dx, dy) {
    if (over) { reset(); }
    // block a direct reverse
    if (dx === -dir.x && dy === -dir.y) return;
    nextDir = { x: dx, y: dy };
    if (!running) start();
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // checker board
    for (let x = 0; x < N; x++) {
      for (let y = 0; y < N; y++) {
        ctx.fillStyle = (x + y) % 2 ? '#150f40' : '#1a1348';
        ctx.fillRect(x * S, y * S, S, S);
      }
    }
    // apple
    ctx.font = (S * 0.9) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍎', food.x * S + S / 2, food.y * S + S / 2 + 1);
    // snake
    snake.forEach((seg, i) => {
      const t = i / Math.max(1, snake.length - 1);
      ctx.fillStyle = over ? '#6b7280' : 'hsl(' + (150 - t * 60) + ',80%,' + (58 - t * 14) + '%)';
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * S + pad, seg.y * S + pad, S - pad * 2, S - pad * 2, 6);
      ctx.fill();
    });
    // eyes
    const h = snake[0];
    ctx.fillStyle = '#0f0b2e';
    const ex = dir.x === 0 ? [-4, 4] : [dir.x * 4, dir.x * 4];
    const ey = dir.y === 0 ? [-4, 4] : [dir.y * 4, dir.y * 4];
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      ctx.arc(h.x * S + S / 2 + ex[k], h.y * S + S / 2 + ey[k], 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };
    if (map[k]) { e.preventDefault(); steer(map[k][0], map[k][1]); }
  });

  // swipe
  let tx = 0, ty = 0;
  window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0);
    else steer(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  window.focus();
  reset();
})();
</script>
</body>
</html>
